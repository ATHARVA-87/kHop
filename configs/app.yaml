name: app
description: >
  The app (Phase 6): A9 (input gate + datamarking + verifier marks) + one-company filter on
  the local route (dev recall@10 +0.015, local +0.031, results/a6_filter.json).
snapshot: semis-2025
seed: 0
chunker:
  type: structured
  child_words: 200
  child_chars: 1400
  parent_words: 800
  headers: true
embedder:
  model: BAAI/bge-small-en-v1.5
retrieval:
  type: routed
  router: rules
  graph_max_edges: 12
  rerank:
    model: BAAI/bge-reranker-base
    candidates: 50
  top_k: 20
  local_company_filter: true
generation:
  provider: ollama
  model: qwen3.5:4b
  context_chunks: 5
judge:
  provider: gemini
  model: gemini-3.6-flash
guard:
  input_gate: true
  datamark: true
  verify: true
