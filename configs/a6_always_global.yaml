name: a6_always_global
description: >
  Gate baseline: every question sent to the global route. A6: rule router (0 companies -> global, 2+ filers -> multi-hop, else local) choosing
  hybrid+reranker (local), graph traversal (multi-hop) or company-diverse ranking (global).
snapshot: semis-2025
seed: 0
chunker:
  type: structured
  child_words: 200
  child_chars: 1400
  parent_words: 800
  headers: true
embedder:
  model: BAAI/bge-small-en-v1.5
retrieval:
  type: routed
  router: global
  graph_max_edges: 12
  rerank:
    model: BAAI/bge-reranker-base
    candidates: 50
  top_k: 20
generation:
  provider: ollama
  model: qwen3.5:4b
  context_chunks: 5
judge:
  provider: gemini
  model: gemini-3.6-flash
