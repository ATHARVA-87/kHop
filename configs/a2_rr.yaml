name: a2_rr
description: >
  A2-RR: no-graph baseline for multi-company questions. A2's hybrid list, alternating between
  the filers named in the question (same entity linker as A4, no graph edges).
snapshot: semis-2025
seed: 0
chunker:
  type: structured
  child_words: 200
  child_chars: 1400
  parent_words: 800
  headers: true
embedder:
  model: BAAI/bge-small-en-v1.5
retrieval:
  type: hybrid_rr
  top_k: 20
generation:
  provider: ollama
  model: qwen3.5:4b
  context_chunks: 5
judge:
  provider: gemini
  model: gemini-3.6-flash
