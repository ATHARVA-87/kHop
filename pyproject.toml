[project]
name = "plexus"
version = "0.1.0"
description = "Eval-driven, multi-agent hybrid GraphRAG over SEC filings"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
# Core deps are light so CI stays fast and free. Heavy ML deps live in the `ml` extra.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "litellm>=1.50",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.26,<2",
]

[project.optional-dependencies]
ml = [
    "torch==2.5.1",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.12",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: SEC text is full of typographic quotes/dashes we must match on purpose.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ml: needs the heavy `ml` extra (torch, sentence-transformers, qdrant); skipped in CI",
    "network: touches the network; never run in CI",
]

[tool.uv]
# torch is pinned to the version already in the developer's conda env.
# CPU wheels are enough for CI; the lock only needs to be consistent.
