[project]
name = "plexus"
version = "0.1.0"
description = "Eval-driven, multi-agent hybrid GraphRAG over SEC filings"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
# Core deps are light so CI stays fast and free. Heavy ML deps live in the `ml` extra.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "litellm>=1.50",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.26,<2",
]

[project.optional-dependencies]
ml = [
    "torch==2.6.0",
    # 2.5.1 -> 2.6.0 on 2026-10-29 (owner approved; security fixes). transformers stays < 5 (ADR 0002)
    "transformers>=4.41,<5",
    "sentence-transformers>=3,<6",
    "qdrant-client>=1.12",
]
graph = [
    # quote grounding (fuzzy span alignment) and legal-suffix stripping; research scout 2026-10-28
    "rapidfuzz==3.14.6",
    "cleanco==2.3",
    # LadybugDB = maintained fork of Kuzu (archived 2025-10-10); ADR 0006. Pinned exactly:
    # the PyPI name "ladybug" was transferred from an unrelated 2014 project.
    "ladybug==0.21.2",
]
serve = [
    # web service (Phase 6): FastAPI's built-in Server-Sent Events (>= 0.135); versions already
    # in the env, no advisories on 2026-10-29
    "fastapi==0.143.1",
    "uvicorn==0.54.0",
    "starlette==1.8.0",  # the tested version in the env (lock would pick a newer one)
]
agents = [
    # wiring only (route -> retrieve -> answer), in-memory, no checkpointer, LangSmith off.
    # >= 1.2.14 for GHSA-3fx2-cqw9-xr3c (2026-10-28); ADK/LangGraph/plain-Python compared 2026-10-29
    "langgraph==1.2.15",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: SEC text is full of typographic quotes/dashes we must match on purpose.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ml: needs the heavy `ml` extra (torch, sentence-transformers, qdrant); skipped in CI",
    "network: touches the network; never run in CI",
]

[tool.uv]
# torch is pinned to the version already in the developer's conda env.
# CPU wheels are enough for CI; the lock only needs to be consistent.
