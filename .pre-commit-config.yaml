repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      # fetched reference files must stay byte-identical (their sha256 is recorded)
      - id: end-of-file-fixer
        exclude: ^data/reference/
      - id: trailing-whitespace
        exclude: ^data/reference/
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-secrets
        name: block API keys, tokens and personal email addresses
        language: pygrep
        entry: '(AIza[0-9A-Za-z_-]{30,}|gsk_[0-9A-Za-z]{20,}|sk-[A-Za-z0-9_-]{20,}|ghp_[0-9A-Za-z]{30,}|github_pat_[0-9A-Za-z_]{20,}|hf_[A-Za-z0-9]{30,}|xox[baprs]-[0-9A-Za-z-]{10,}|[A-Za-z0-9._%+-]+@(gmail|yahoo|outlook|hotmail)\.com)'
        exclude: ^\.pre-commit-config\.yaml$
      - id: no-home-paths
        name: block absolute home paths (username / machine layout)
        language: pygrep
        entry: '(/home/[a-z_][a-z0-9_-]*/|/Users/[A-Za-z0-9._-]+/|[A-Za-z]:\\Users\\)'
        exclude: ^\.pre-commit-config\.yaml$
